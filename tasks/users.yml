---

- name: Ensure that groups are present
  ansible.builtin.group:
    name: "{{ item.name | default(item) }}"
    system: "{{ item.system | default(false) }}"
  loop: "{{ users_groups }}"

- name: Ensure that removed groups are not present
  ansible.builtin.group:
    name: "{{ item }}"
    state: absent
  loop: "{{ users_remove_groups }}"

- name: Create per user groups
  ansible.builtin.group:
    name: "{{ item.name | default(item) }}"
  when: users_to_install | length == 0 or item.name | default(item) in users_to_install
  loop: "{{ users_users }}"

- name: Ensure the users are present
  ansible.builtin.user:
    name: "{{ item.name | default(item) }}"
    comment: "{{ item.comment | default('') }}"
    createhome: "{{ item.createhome | default(true) }}"
    group: "{{ item.group | default(item.name | default(item)) }}"
    groups: "{{ item.groups | default('') }}"
    home: "{{ item.home | default('/home/' + item.name | default(item)) }}"
    move_home: "{{ item.move_home | default(false) }}"
    non_unique: "{{ item.non_unique | default(false) }}"
    password: "{{ item.password | default(omit) }}"
    shell: "{{ item.shell | default(users_shell) }}"
    system: "{{ item.system | default(false) }}"
    update_password: "{{ item.update_password | default('always') }}"
  when: users_to_install | length == 0 or item.name | default(item) in users_to_install
  loop: "{{ users_users }}"

- name: Ensure the installed users have groups
  ansible.builtin.user:
    name: "{{ item.name | default(item) }}"
    groups: "{{ item.groups | default('') }}"
    append: true
  when: item.groups | default('') | length > 0
  loop: "{{ users_users }}"

- name: Ensure the removed users are not present
  ansible.builtin.user:
    name: "{{ item }}"
    state: absent
    remove: true
  loop: "{{ users_remove_users }}"

- name: Ensure the users ssh keys are present
  ansible.posix.authorized_key:
    user: "{{ item.0.name }}"
    key: "{{ item.1 }}"
  when: users_to_install | length == 0 or item.0.name in users_to_install
  loop: "{{ users_ssh_keys | subelements('authorized') }}"
